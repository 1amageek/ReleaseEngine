name: ReleaseEngine CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-fixture:
    runs-on: macos-26
    steps:
      - name: Check out ReleaseEngine
        uses: actions/checkout@v4

      - name: Check out the local package graph
        shell: bash
        run: |
          set -euo pipefail
          clone_package() {
            local repository="$1"
            local directory="$2"
            git clone --depth 1 --branch main "https://github.com/1amageek/${repository}.git" "../${directory}"
          }
          clone_package CircuiteFoundation CircuiteFoundation
          clone_package Xcircuite Xcircuite
          clone_package DesignFlowKernel DesignFlowKernel
          clone_package LogicDesign LogicDesign
          clone_package PDKKit PDKKit
          clone_package swift-mask-data swift-mask-data
          clone_package ToolQualification ToolQualification
          clone_package SignoffToolSupport SignoffToolSupport
          clone_package TimingEngine TimingEngine
          clone_package PhysicalDesignEngine PhysicalDesignEngine

      - name: Build the release product
        shell: bash
        run: |
          set -euo pipefail
          perl -e 'alarm shift; exec @ARGV' 120 swift build -c release

      - name: Run the complete package test target
        shell: bash
        run: |
          set -euo pipefail
          perl -e 'alarm shift; exec @ARGV' 120 swift test

      - name: Verify independent release authorization
        shell: bash
        run: |
          set -euo pipefail
          perl -e 'alarm shift; exec @ARGV' 120 swift test --filter ReleaseAuthorizationTests
